version: "3"
services:
    mysql:
        container_name: mysql
        platform: linux/x86_64
        image: mysql:5.7.41
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: admin
            MYSQL_DATABASE: prestashop
            MYSQL_USER: admin
            MYSQL_PASSWORD: admin
        volumes:
            - ./docker/mysql:/docker-entrypoint-initdb.d
        networks:
            - prestashop_network
    
    prestashop:
        platform: linux/x86_64
        container_name: prestashop
        build: .
        restart: unless-stopped
        depends_on:
            - mysql
        ports:
            - 443:443
        volumes:
            - ./prestashop_src:/var/www/html
        environment:
            DB_SERVER: mysql
            DB_NAME: prestashop
            DB_USER: admin
            DB_PASSWD: admin
            PS_INSTALL_AUTO: 0
            PS_FOLDER_ADMIN: admin
            PS_DEV_MODE: 1
            # set admin email
            ADMIN_MAIL: admin@prestashop.com
            # set admin password
            ADMIN_PASSWD: admin
        networks:
            - prestashop_network
    phpmyadmin:
        platform: linux/x86_64
        container_name: phpmyadmin
        image: phpmyadmin/phpmyadmin:5.2.3
        restart: unless-stopped
        depends_on:
            - mysql
        ports:
            - 8081:80
        environment:
            PMA_HOST: mysql
            MYSQL_ROOT_PASSWORD: admin
        networks:
            - prestashop_network
networks:
    prestashop_network:
